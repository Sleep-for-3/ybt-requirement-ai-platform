# 反向代理：公网 -> 前端(127.0.0.1:13000) / 后端 API(127.0.0.1:18000)
#
# 部署位置：/etc/nginx/sites-enabled/ybt.conf（生产机 103.236.97.210:42438）
# 端口对应 .env 的 FRONTEND_HOST_PORT / BACKEND_HOST_PORT。
#
# 超时必须 ≥ 600s：真实模型的一次生成链路可能持续数分钟
# （见 frontend/lib/request-timeout.mjs 与《发布与恢复 Runbook》第 7 条），
# 代理层的 60s/300s 默认值会把长耗时请求截断成 504。
server {
    listen 80;
    listen [::]:80;
    server_name 57008897.xyz www.57008897.xyz 103.236.97.210;
    client_max_body_size 100m;

    location /api/ {
        proxy_pass http://127.0.0.1:18000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 30s;
    }

    location / {
        proxy_pass http://127.0.0.1:13000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 30s;
    }
}
