# 服务器生产 overlay（生产目标机：Ubuntu 22.04 + Docker 29 + Compose v2.40）
#
#   docker compose -f docker-compose.yml -f docker-compose.server.yml up -d
#
# docker-compose.yml 是通用生产拓扑（迁移门禁、健康检查、依赖端口不对外）。
# 本文件只描述“这一台服务器”无法写进通用编排的差异：
#
#   * 不可变发布镜像：ybt-backend:<YBT_RELEASE_TAG> / ybt-frontend:<YBT_RELEASE_TAG>，
#     回滚只需把 YBT_RELEASE_TAG 改回上一版并重新 up，不需要重新构建；
#   * 已经在本机存在的依赖镜像标签（PostgreSQL/Redis/Milvus/MinIO/etcd），
#     避免在生产机上走 Docker Hub 拉取（该机到海外镜像源不稳定）；
#   * /data/ybt 下的持久化目录：Milvus、Milvus MinIO、业务对象存储、Embedding 模型缓存；
#     PostgreSQL、Redis、etcd 继续使用 named volume，保持既有数据不动；
#   * 本地离线 Embedding 服务（FastEmbed + 本地模型缓存），供 EMBEDDING_PROVIDER=local_vllm 使用。
#
# 任何密钥都不写在这里：全部来自同目录 .env（已被 .gitignore 忽略）。
# 顶层 profile 由 .env 的 COMPOSE_PROFILES=milvus,object-storage 控制。

services:
  postgres:
    image: postgres:16
    ports: !override []

  redis:
    image: redis:7-alpine
    ports: !override []

  migrate:
    image: ybt-backend:${YBT_RELEASE_TAG:?Set YBT_RELEASE_TAG in .env}

  backend:
    image: ybt-backend:${YBT_RELEASE_TAG:?Set YBT_RELEASE_TAG in .env}
    depends_on:
      embedding:
        condition: service_healthy
      milvus:
        condition: service_healthy

  worker:
    image: ybt-backend:${YBT_RELEASE_TAG:?Set YBT_RELEASE_TAG in .env}
    depends_on:
      embedding:
        condition: service_healthy
      milvus:
        condition: service_healthy

  beat:
    image: ybt-backend:${YBT_RELEASE_TAG:?Set YBT_RELEASE_TAG in .env}

  frontend:
    image: ybt-frontend:${YBT_RELEASE_TAG:?Set YBT_RELEASE_TAG in .env}

  embedding:
    image: ybt-backend:${YBT_RELEASE_TAG:?Set YBT_RELEASE_TAG in .env}
    container_name: ybt-embedding
    profiles: ["milvus"]
    restart: unless-stopped
    command: ["uvicorn", "app.local_embedding_server:app", "--host", "0.0.0.0", "--port", "11434"]
    environment:
      FASTEMBED_CACHE_PATH: /data/fastembed-cache
      FASTEMBED_THREADS: "${FASTEMBED_THREADS:-4}"
      HF_HUB_OFFLINE: "1"
    volumes:
      - /data/ybt/fastembed-cache:/data/fastembed-cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:11434/health', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 12
      start_period: 20s

  object-storage:
    volumes: !override
      - /data/ybt/object-storage:/data

  milvus-minio:
    volumes: !override
      - /data/ybt/milvus-minio:/minio_data

  milvus:
    volumes: !override
      - /data/ybt/milvus:/var/lib/milvus
