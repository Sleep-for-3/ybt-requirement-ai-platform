name: Release Candidate CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rc-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ENVIRONMENT: test
      AUTH_MODE: optional
      APP_SECRET_KEY: ci-app-secret
      JWT_SECRET_KEY: ci-jwt-secret-with-at-least-32-characters
      DATABASE_URL: sqlite:////tmp/ybt-ci.db
      STORAGE_PROVIDER: local
      STORAGE_DIR: /tmp/ybt-ci-storage
      TASK_QUEUE_PROVIDER: inline
      VECTOR_STORE_PROVIDER: mock
      LLM_PROVIDER: mock
      EMBEDDING_PROVIDER: mock
      LINEAGE_GIT_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Backend full tests
        working-directory: backend
        run: python -m pytest -q

  production-auth-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENVIRONMENT: production
      AUTH_MODE: required
      APP_SECRET_KEY: ci-production-app-secret
      JWT_SECRET_KEY: ci-production-jwt-secret-with-at-least-32-characters
      DATABASE_URL: sqlite:////tmp/ybt-ci-auth.db
      STORAGE_PROVIDER: local
      STORAGE_DIR: /tmp/ybt-ci-auth-storage
      TASK_QUEUE_PROVIDER: inline
      VECTOR_STORE_PROVIDER: mock
      LLM_PROVIDER: mock
      EMBEDDING_PROVIDER: mock
      LINEAGE_GIT_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Production auth and isolation smoke tests
        working-directory: backend
        run: python -m pytest -q tests/test_release_hardening.py

  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: sqlite:////tmp/ybt-ci-migrations.db
      ENVIRONMENT: test
      AUTH_MODE: optional
      APP_SECRET_KEY: ci-app-secret
      JWT_SECRET_KEY: ci-jwt-secret-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Upgrade, check head, downgrade and re-upgrade
        working-directory: backend
        run: |
          rm -f /tmp/ybt-ci-migrations.db
          python -m alembic upgrade head
          test "$(python -m alembic current | grep -c '(head)')" -eq 1
          test "$(python -m alembic heads | wc -l)" -eq 1
          python -m alembic downgrade -1
          python -m alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Frontend tests
        run: npm test
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
